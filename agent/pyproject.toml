[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dashboard-agent"
version = "0.1.0"
description = "Local Agent Python para o Dashboard Modular de Widgets Locais"
authors = [{ name = "Carlos Teixeira" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "pydantic>=2.7.0"
]
